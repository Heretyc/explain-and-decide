description = "Review the decision ledger (LEDGER.md) or record a decision by hand"
prompt = "Work with the project's decision ledger, LEDGER.md, as asked here: {{args}}. If no request is given, review it. First run the bundled script, scripts/ledger.ts inside the installed explain-and-decide skill folder (${CLAUDE_SKILL_DIR} on Claude Code, else the install path of the skill, or skills/explain-and-decide in a checkout of this repository; the path is never relative to the current folder), run as node --experimental-strip-types followed by the full quoted script path, with -info to find LEDGER.md and its state; say so plainly if the ledger is disabled or not created yet. To review: group entries by Status, surface Deprecated and Rejected first, show each decision with its chosen option plus the Pro and Con that drove it, quote its Context in plain language, and never paraphrase a decision without its Con. To record a decision: build an entry in the grammar (one key: value per line with title, context, two or more opt each with pro and con, pick, why, plus, minus, and the source keys), pick -decision-human, -decision-agent or -decision-external by who decided, deliver it by entry file or by standard input, and report the script's output verbatim. A reversal is a new entry whose context names the entry it reverses, never an edit. Never edit LEDGER.md directly, never publish or quote it outside the user's session, and never remove a .no-ledger marker without being asked."
